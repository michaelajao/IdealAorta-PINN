[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idealaorta-pinn"
version = "0.1.0"
description = "Parametric physics-informed neural-network surrogate for idealized aortic aneurysm hemodynamics."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Michael Ajao-Olarinoye" },
]
keywords = ["PINN", "hemodynamics", "aortic aneurysm", "CFD", "surrogate model", "wall shear stress"]

# NOTE: torch (+CUDA), pyvista and vtk are expected to be provided by the
# conda environment (dl_env) and are intentionally NOT pinned here so that
# `pip install -e .` does not try to reinstall the CUDA build.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "pyarrow",
    "plotly>=5",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
# Heavy / environment-provided packages, listed for documentation only.
heavy = ["torch", "pyvista", "vtk", "open3d"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["idealaorta_pinn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # long lines tolerated in scientific code / docstrings
