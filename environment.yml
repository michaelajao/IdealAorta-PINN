# Conda environment spec mirroring the verified `dl_env` used for development.
# The project was developed against this environment (Python 3.11, torch 2.7
# with CUDA 12.8). Recreate with:
#     conda env create -f environment.yml
# or simply reuse the existing `dl_env`.
name: idealaorta-pinn
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pyyaml
  - pyarrow
  - matplotlib
  - tqdm
  - pip
  - pip:
      - plotly>=5
      - pyvista>=0.46
      - vtk>=9.5
      # torch is installed separately to pick up the correct CUDA build:
      #   pip install torch --index-url https://download.pytorch.org/whl/cu128
      # open3d is optional (wall-normal estimation); PCA fallback is built in.
      # - open3d
