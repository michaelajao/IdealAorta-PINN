# Stage A + S1 + S2 (NO S4) — in-sample (Case 1) ablation isolating S4.
# Identical to stageA_case1_s124 EXCEPT anisotropic_fourier is OFF (isotropic
# Fourier). Purpose: the S124 run showed transverse velocity speckle + peak
# over-prediction (sys 2.38 vs CFD 1.44; dia 0.183 vs 0.101). The transverse
# concentration implicates S4's per-axis bandwidth boost ([1, 2.85, 4.54]) over-
# resolving a field that is smooth transversely. If this run (S4 off) removes the
# speckle and lowers per-phase velocity NRMSE while holding WSS/recirc, S4 is net-
# negative here and is dropped from the paper config. Single variable changed.

experiment:
  name: stageA_case1_s12
  description: "Stage A in-sample with S1+S2, isotropic Fourier (S4 ablation)."

random_seed: 42
device: cuda
output_dir: models/stageA_case1_s12

loss_balance:
  per_phase_velocity_scale: true        # S1

data:
  train_cases: [1]
  phases: [systolic, diastolic]
  velocity_kinds: [XY, XZ, "3D"]

model:
  hidden_dim: 128
  num_layers: 5
  num_frequencies: 24
  fourier_scale: 1.0
  anisotropic_fourier: false            # S4 OFF (the ablation)
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims: [16, 16]
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 3
    nu_t_min: 1.0e-3
    initial_nut: 0.02
    lr_multiplier: 10.0

physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 4000

loss_weights:
  velocity: 1.0
  physics: 0.05
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0

adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.05

training:
  epochs: 18000
  lr: 1.0e-4
  scheduler: {type: CosineAnnealingLR, eta_min: 1.0e-6}
  gradient_clip: 1.0
  eval_interval: 250
  save_interval: 1000
  early_stopping: {enabled: true, patience: 2000, min_delta: 1.0e-5}

loaders:
  max_velocity_points: 40000
  volumetric_collocation: true          # S2
  wall_normals_method: auto
  inlet_n_radial: 6
  inlet_n_angular: 12
