# Leave-2.0cm-out fold — train on ALL diseased cases at 2.3 & 2.6 cm, predict the
# held-out 2.0 cm cases. The model sees both training diameters across every
# disease-symmetry class (axisym/anterior/posterior) and must EXTRAPOLATE below the
# training range to the unseen 2.0 cm diameter for all three symmetries.
#   train: cases 4,5,6 (2.3 cm) + 7,8,9 (2.6 cm)   [diseased]
#   held-out (evaluate): cases 1,2,3 (2.0 cm, all symmetries)
# Architecture = final stack: S1 per-phase scaling + S2 volumetric collocation,
# isotropic Fourier (S4 dropped), num_frequencies=16. One of three k-fold arms
# (hold2p0 / richerloo_f16 = hold-2.3cm / hold2p6) that together cover every inlet
# diameter. Memory trimmed (6 train cases = 12 groups).

experiment:
  name: stageB_kfold_hold2p0
  description: "Leave-2.0cm-out (train 4,5,6,7,8,9; hold 1,2,3 = 2.0 cm). S1+S2 isotropic, 16 freq."

random_seed: 42
device: cuda
output_dir: models/stageB_kfold_hold2p0

loss_balance:
  per_phase_velocity_scale: true        # S1

data:
  train_cases: [4, 5, 6, 7, 8, 9]
  phases: [systolic, diastolic]
  velocity_kinds: ["3D"]

model:
  hidden_dim: 128
  num_layers: 6
  num_frequencies: 16
  fourier_scale: 1.0
  anisotropic_fourier: false            # S4 OFF
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims: [32, 32]
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 4
    nu_t_min: 1.0e-3
    initial_nut: 0.02
    lr_multiplier: 10.0

physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 500                     # per group (memory: peak fit incl adaptive-update spike)

loss_weights:
  velocity: 1.0
  physics: 0.05
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0

adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.05

training:
  epochs: 18000
  lr: 1.0e-4
  scheduler: {type: CosineAnnealingLR, eta_min: 1.0e-6}
  gradient_clip: 1.0
  eval_interval: 250
  save_interval: 1000
  early_stopping: {enabled: true, patience: 2000, min_delta: 1.0e-5}

loaders:
  max_velocity_points: 3000             # per group; 12 groups -> 36k total (memory)
  volumetric_collocation: true          # S2
  wall_normals_method: auto
  inlet_n_radial: 6
  inlet_n_angular: 12
