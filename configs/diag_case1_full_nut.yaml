experiment:
  name: diag_case1_full_nut
  description: "DIAGNOSTIC: As diag_case1_full, plus the eddy-viscosity network trained on the CFD's own mu_t/rho (log-space) with its floor lowered from 1e-3 (38x the blood viscosity) to 1e-6."
random_seed: 42
device: cuda
output_dir: models/diag_case1_full_nut
loss_balance:
  per_phase_velocity_scale: true
data:
  train_cases:
  - 1
  phases:
  - systolic
  - diastolic
  velocity_kinds:
  - 3D
  full_export:
    # DIAGNOSTIC: whole-vessel exports (data/processed/full). Same instants as the
    # submitted Case 1 model (1.778 s systolic, 2.4 s diastolic) so it compares directly.
    times_ms: {systolic: 1778, diastolic: 2400}
    block_mm: 2.0            # 3D checkerboard: odd cubes withheld for scoring
    val_every: 5             # a fifth of the withheld cubes monitor training
    velocity_pool: 250000
    collocation_pool: 300000
    resample_interval: 250   # epochs between batch redraws from the pools
    nut_weight: 1.0
model:
  hidden_dim: 128
  num_layers: 5
  num_frequencies: 24
  fourier_scale: 1.0
  anisotropic_fourier: false
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims:
  - 16
  - 16
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 3
    nu_t_min: 1.0e-06
    initial_nut: 3.0e-04
    lr_multiplier: 10.0
physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 4000
loss_weights:
  velocity: 1.0
  physics: 0.05
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0
adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.05
training:
  epochs: 18000
  lr: 0.0001
  scheduler:
    type: CosineAnnealingLR
    eta_min: 1.0e-06
  gradient_clip: 1.0
  eval_interval: 250
  save_interval: 1000
  early_stopping:
    enabled: true
    patience: 2000
    min_delta: 1.0e-05
loaders:
  max_velocity_points: 40000
  max_wall_points: 15000
  wall_normals_method: auto
