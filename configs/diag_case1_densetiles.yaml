# DIAGNOSTIC (not part of the reported study): would denser, volume-like velocity
# supervision fix the in-sample local errors?  Identical to stageA_case1_s12 except
# the velocity data: the 3D streamlines are kept whole and joined by one checkerboard
# colour (2 mm tiles, parity 0) of the XY and XZ slice exports. The other colour
# (parity 1) is never trained on and is where both this model and stageA_case1_s12
# are scored, so every scored point is within about one tile of supervised data --
# roughly what a volumetric export of the 0.8 mm CFD mesh would give everywhere.
# If the ICRZ / sac errors collapse here, the streamline-only export is the limit and
# a volume export is worth requesting; if they persist, the model is the limit.

experiment:
  name: diag_case1_densetiles
  description: "Case 1 in-sample, 3D streamlines + checkerboard half of XY/XZ slices (tile 2 mm)."

random_seed: 42
device: cuda
output_dir: models/diag_case1_densetiles

loss_balance:
  per_phase_velocity_scale: true

data:
  train_cases: [1]
  phases: [systolic, diastolic]
  velocity_kinds: ["3D", "XY", "XZ"]

model:
  hidden_dim: 128
  num_layers: 5
  num_frequencies: 24
  fourier_scale: 1.0
  anisotropic_fourier: false
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims: [16, 16]
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 3
    nu_t_min: 1.0e-3
    initial_nut: 0.02
    lr_multiplier: 10.0

physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 4000

loss_weights:
  velocity: 1.0
  physics: 0.05
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0

adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.05

training:
  epochs: 18000
  lr: 1.0e-4
  scheduler: {type: CosineAnnealingLR, eta_min: 1.0e-6}
  gradient_clip: 1.0
  eval_interval: 250
  save_interval: 1000
  early_stopping: {enabled: true, patience: 2000, min_delta: 1.0e-5}

loaders:
  max_velocity_points: 70000             # pool cap; the per-kind caps below bind first
  kind_max_points: {"3D": 40000, "XY": 6000, "XZ": 6000}   # ~0.7 mm spacing on the train tiles
  slice_tiles: {tile_mm: 2.0, parity: 0} # train colour; parity 1 is the scored hold-out
  volumetric_collocation: true
  wall_normals_method: auto
  inlet_n_radial: 6
  inlet_n_angular: 12
