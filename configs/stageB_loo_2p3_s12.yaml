# Stage B + S1 + S2 (NO S4) — leave-2.3cm-out, the CANDIDATE FINAL headline config.
# Identical to stageB_loo_2p3_s124 EXCEPT anisotropic_fourier is OFF. The Stage A
# in-sample ablation (stageA_case1_s12 vs _s124) showed S4 injects transverse
# velocity speckle + peak over-prediction (dia peak 0.183 vs 0.139 m/s; sys NRMSE
# 9.8% vs 7.1%) with no WSS gain. This run confirms the S4-off decision on the
# headline LOO task and is the intended final config: S1 per-phase scaling +
# S2 volumetric collocation + isotropic Fourier.

experiment:
  name: stageB_loo_2p3_s12
  description: "LOO 2.3cm with S1 + S2, isotropic Fourier (S4 dropped) — candidate final."

random_seed: 42
device: cuda
output_dir: models/stageB_loo_2p3_s12

loss_balance:
  per_phase_velocity_scale: true        # S1

data:
  train_cases: [1, 7]
  phases: [systolic, diastolic]
  velocity_kinds: [XY, XZ, "3D"]

model:
  hidden_dim: 128
  num_layers: 6
  num_frequencies: 16
  fourier_scale: 1.0
  anisotropic_fourier: false            # S4 OFF (the decision from the Stage A ablation)
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims: [32, 32]
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 4
    nu_t_min: 1.0e-3
    initial_nut: 0.02
    lr_multiplier: 10.0

physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 2500

loss_weights:
  velocity: 1.0
  physics: 0.05
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0

adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.05

training:
  epochs: 18000
  lr: 1.0e-4
  scheduler: {type: CosineAnnealingLR, eta_min: 1.0e-6}
  gradient_clip: 1.0
  eval_interval: 250
  save_interval: 1000
  early_stopping: {enabled: true, patience: 2000, min_delta: 1.0e-5}

loaders:
  max_velocity_points: 20000
  volumetric_collocation: true          # S2
  wall_normals_method: auto
  inlet_n_radial: 6
  inlet_n_angular: 12
