# Stage A — single-case reconstruction de-risk (Case 1, 2.0 cm axisymmetric diseased).
# Train on XY-plane + 3D velocity (+ wall pressure/WSS); HOLD OUT the XZ plane to
# measure generalization (target velocity rel-L2 < ~0.10).

experiment:
  name: stageA_case1
  description: "Single-case reconstruction (Case 1); XZ plane held out for validation."

random_seed: 42
device: cuda
output_dir: models/stageA_case1

data:
  train_cases: [1]
  phases: [systolic, diastolic]
  velocity_kinds: [XY, "3D"]        # XZ held out
  holdout: {case: 1, phase: systolic, kind: XZ}

model:
  hidden_dim: 128
  num_layers: 5
  num_frequencies: 16
  fourier_scale: 1.0
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims: [16, 16]
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 3
    nu_t_min: 1.0e-3
    initial_nut: 0.02
    lr_multiplier: 10.0

physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 2500

loss_weights:        # manual fallback (used until adaptive weights kick in)
  velocity: 1.0
  physics: 0.01
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0

adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.01

training:
  epochs: 1500
  lr: 1.0e-4
  scheduler: {type: CosineAnnealingLR, eta_min: 1.0e-6}
  gradient_clip: 1.0
  eval_interval: 100
  save_interval: 500
  # early stopping is on the stable monitor (held-out XZ rel-L2 for Stage A)
  early_stopping: {enabled: true, patience: 600, min_delta: 1.0e-5}

loaders:
  max_velocity_points: 20000
  wall_normals_method: auto
  inlet_n_radial: 6
  inlet_n_angular: 12
