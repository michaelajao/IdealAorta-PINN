# Stage B (phase-balanced) — same leave-2.3cm-out experiment as stageB_loo_2p3,
# but with a per-group RELATIVE velocity loss (loss_balance.relative_velocity).
# Under the single systolic-scale U_ref the absolute-MSE velocity loss all but
# ignores the near-stagnant diastolic phase, so the baseline PINN over-predicts
# diastole. The relative form divides each (case,phase) group's velocity error
# by that group's own target magnitude, so systole and diastole contribute
# equally. Compare against models/stageB_loo_2p3 (baseline) on held-out Case 4.
#
# Run with:  CUDA_VISIBLE_DEVICES=1 python scripts/run.py \
#              --config configs/stageB_loo_2p3_phasebal.yaml --cases 4 --no-interactive

experiment:
  name: stageB_loo_2p3_phasebal
  description: "Leave-2.3cm-out with phase-balanced (relative) velocity loss; predict unseen 2.3 cm."

random_seed: 42
device: cuda
output_dir: models/stageB_loo_2p3_phasebal

# Phase-balanced velocity supervision (the only change vs the baseline config).
loss_balance:
  relative_velocity: true

data:
  train_cases: [1, 7]          # 2.0 cm + 2.6 cm axisymmetric diseased
  phases: [systolic, diastolic]
  velocity_kinds: [XY, XZ, "3D"]
  # held-out target is Case 4 (2.3 cm) -- validated as a separate case, not a plane.

model:
  hidden_dim: 128
  num_layers: 6
  num_frequencies: 16
  fourier_scale: 1.0
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims: [32, 32]
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 4
    nu_t_min: 1.0e-3
    initial_nut: 0.02
    lr_multiplier: 10.0

physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 2500   # 4 (case,phase) groups + adaptive-weight graph retention; keep <48 GB

loss_weights:
  velocity: 1.0
  physics: 0.01
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0

adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.01

training:
  epochs: 3000
  lr: 1.0e-4
  scheduler: {type: CosineAnnealingLR, eta_min: 1.0e-6}
  gradient_clip: 1.0
  eval_interval: 100
  save_interval: 250
  early_stopping: {enabled: true, patience: 1500, min_delta: 1.0e-6}

loaders:
  max_velocity_points: 20000
  wall_normals_method: auto
  inlet_n_radial: 6
  inlet_n_angular: 12
