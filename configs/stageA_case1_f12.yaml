# Stage A in-sample (Case 1) — S1+S2, S4 OFF, FEWER Fourier frequencies (12, was 24).
# Second arm of the architecture-tuning sweep (paired with stageA_case1_lowbw, which
# instead halves fourier_scale). This arm halves the NUMBER of frequencies: less
# basis capacity for high-frequency texture while keeping fourier_scale=1.0. Compare
# peak over-prediction + NRMSE + WSS vs stageA_case1_s12 (24 freq) and _lowbw.

experiment:
  name: stageA_case1_f12
  description: "Stage A in-sample S1+S2, isotropic Fourier, num_frequencies=12."

random_seed: 42
device: cuda
output_dir: models/stageA_case1_f12

loss_balance:
  per_phase_velocity_scale: true        # S1

data:
  train_cases: [1]
  phases: [systolic, diastolic]
  velocity_kinds: ["3D"]

model:
  hidden_dim: 128
  num_layers: 5
  num_frequencies: 12                   # TUNED: half the frequencies (was 24)
  fourier_scale: 1.0
  anisotropic_fourier: false            # S4 OFF
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims: [16, 16]
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 3
    nu_t_min: 1.0e-3
    initial_nut: 0.02
    lr_multiplier: 10.0

physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 4000

loss_weights:
  velocity: 1.0
  physics: 0.05
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0

adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.05

training:
  epochs: 18000
  lr: 1.0e-4
  scheduler: {type: CosineAnnealingLR, eta_min: 1.0e-6}
  gradient_clip: 1.0
  eval_interval: 250
  save_interval: 1000
  early_stopping: {enabled: true, patience: 2000, min_delta: 1.0e-5}

loaders:
  max_velocity_points: 40000
  volumetric_collocation: true          # S2
  wall_normals_method: auto
  inlet_n_radial: 6
  inlet_n_angular: 12
