# Leave-one-diameter-out on the whole-vessel exports (data/processed/full): hold 7,8,9 = 2.6 cm, extrapolation above.
# Same architecture and schedule as the stageB k-fold arms; what changes is the data
# (fluid volume, whole wall, CFD inlet and outlet faces, volume collocation), one common
# instant for every case (1.780 s / 2.4 s) and the eddy-viscosity net, trained on the
# CFD's own mu_t/rho with its floor lowered from 1e-3 (38x blood viscosity) to 1e-6.
# Batches are redrawn from per-group pools every 250 epochs, so the small per-group
# batch (12 groups must fit in 48 GB) still sweeps the whole volume over training.

adaptive_weights:
  alpha: 0.9
  enabled: true
  physics_floor: 0.05
  ref: velocity
  update_interval: 250
  weight_cap: 50.0
data:
  phases:
  - systolic
  - diastolic
  train_cases:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  velocity_kinds:
  - 3D
  full_export:
    times_ms:
      systolic: 1780
      diastolic: 2400
    block_mm: 2.0
    val_every: 5
    train_splits:
    - 0
    - 1
    velocity_pool: 250000
    collocation_pool: 300000
    resample_interval: 250
    nut_weight: 1.0
device: cuda
experiment:
  name: lodo_full_hold2p6
  description: LODO on whole-vessel exports, train [1, 2, 3, 4, 5, 6], hold 7,8,9
    = 2.6 cm, extrapolation above; CFD nu_t target.
loaders:
  max_velocity_points: 10000
  max_wall_points: 3500
  wall_normals_method: auto
loss_balance:
  per_phase_velocity_scale: true
loss_weights:
  inlet: 1.0
  noslip: 10.0
  outlet: 1.0
  physics: 0.05
  pressure: 1.0
  velocity: 1.0
  wss: 1.0
model:
  anisotropic_fourier: false
  coord_encoder_dims: null
  fourier_scale: 1.0
  hidden_dim: 128
  num_frequencies: 16
  num_layers: 6
  nut:
    hidden_dim: 64
    initial_nut: 0.0003
    lr_multiplier: 10.0
    nu_t_min: 1.0e-06
    num_layers: 4
  param_encoder_dims:
  - 32
  - 32
  use_fourier: true
  use_param_encoder: true
output_dir: models/lodo_full_hold2p6
physics:
  mu: 0.0035
  n_collocation: 800
  rho: 1060.0
random_seed: 42
training:
  early_stopping:
    enabled: true
    min_delta: 1.0e-05
    patience: 2000
  epochs: 18000
  eval_interval: 250
  gradient_clip: 1.0
  lr: 0.0001
  save_interval: 1000
  scheduler:
    eta_min: 1.0e-06
    type: CosineAnnealingLR
