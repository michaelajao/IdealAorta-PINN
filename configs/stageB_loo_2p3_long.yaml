# Stage B (LONG) — identical leave-2.3cm-out experiment as stageB_loo_2p3, but
# trained to convergence (12000 epochs, like Stage A) instead of 3000. The 3000-
# epoch baseline was under-converged (held-out field over-predicted/speckled);
# this run tests how much of the ~20% systolic LOO error is just under-training.
# Kept as a SEPARATE experiment so 3k (stageB_loo_2p3) vs 12k can be compared.
#
# Run with:  CUDA_VISIBLE_DEVICES=1 python scripts/run.py \
#              --config configs/stageB_loo_2p3_long.yaml --cases 4 --no-interactive

experiment:
  name: stageB_loo_2p3_long
  description: "Leave-2.3cm-out trained to convergence (12000 epochs); predict unseen 2.3 cm."

random_seed: 42
device: cuda
output_dir: models/stageB_loo_2p3_long

data:
  train_cases: [1, 7]          # 2.0 cm + 2.6 cm axisymmetric diseased
  phases: [systolic, diastolic]
  velocity_kinds: [XY, XZ, "3D"]

model:
  hidden_dim: 128
  num_layers: 6
  num_frequencies: 16
  fourier_scale: 1.0
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims: [32, 32]
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 4
    nu_t_min: 1.0e-3
    initial_nut: 0.02
    lr_multiplier: 10.0

physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 2500   # 4 (case,phase) groups + adaptive-weight graph retention; keep <48 GB

loss_weights:
  velocity: 1.0
  physics: 0.01
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0

adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.01

training:
  epochs: 12000                 # train to convergence (Stage A needed ~12k)
  lr: 1.0e-4
  scheduler: {type: CosineAnnealingLR, eta_min: 1.0e-6}
  gradient_clip: 1.0
  eval_interval: 250
  save_interval: 1000
  early_stopping: {enabled: true, patience: 2000, min_delta: 1.0e-5}

loaders:
  max_velocity_points: 20000
  wall_normals_method: auto
  inlet_n_radial: 6
  inlet_n_angular: 12
