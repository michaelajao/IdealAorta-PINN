# DIAGNOSTIC: can the PINN infer unmeasured fields? Trained on velocity only (half the
# 2 mm cubes, like a 4D-flow MRI voxel grid); wall-shear and wall-pressure losses are
# switched off and the outlet face keeps only its pressure as the gauge datum.

experiment:
  name: diag_case1_velonly_nut
  description: 'DIAGNOSTIC: Case 1 in-sample, as diag_case1_velonly plus the CFD eddy
    viscosity as a target (upper bound: nu_t known).'
random_seed: 42
device: cuda
output_dir: models/diag_case1_velonly_nut
loss_balance:
  per_phase_velocity_scale: true
data:
  train_cases:
  - 1
  phases:
  - systolic
  - diastolic
  velocity_kinds:
  - 3D
  full_export:
    times_ms:
      systolic: 1778
      diastolic: 2400
    block_mm: 2.0
    val_every: 5
    velocity_pool: 250000
    collocation_pool: 300000
    resample_interval: 250
    nut_weight: 1.0
model:
  hidden_dim: 128
  num_layers: 5
  num_frequencies: 24
  fourier_scale: 1.0
  anisotropic_fourier: false
  use_fourier: true
  use_param_encoder: true
  param_encoder_dims:
  - 16
  - 16
  coord_encoder_dims: null
  nut:
    hidden_dim: 64
    num_layers: 3
    nu_t_min: 1.0e-06
    initial_nut: 0.0003
    lr_multiplier: 10.0
physics:
  mu: 0.0035
  rho: 1060.0
  n_collocation: 4000
loss_weights:
  velocity: 1.0
  physics: 0.05
  pressure: 1.0
  wss: 1.0
  noslip: 10.0
  inlet: 1.0
  outlet: 1.0
adaptive_weights:
  enabled: true
  update_interval: 250
  alpha: 0.9
  ref: velocity
  weight_cap: 50.0
  physics_floor: 0.05
training:
  epochs: 18000
  lr: 0.0001
  scheduler:
    type: CosineAnnealingLR
    eta_min: 1.0e-06
  gradient_clip: 1.0
  eval_interval: 250
  save_interval: 1000
  early_stopping:
    enabled: true
    patience: 2000
    min_delta: 1.0e-05
  disable_components:
  - pressure
  - wss
loaders:
  max_velocity_points: 40000
  max_wall_points: 15000
  wall_normals_method: auto
